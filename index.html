<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>מדבקות לשבת</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root { --paper:#F1EFEA; --blue:#1F3BEA; --red:#FF3D1F; --pink:#FF5FA2; --white:#fff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--blue); font-family:Heebo,Arial,sans-serif; }
  main { max-width:520px; margin:0 auto; padding:20px 16px 40px; }
  .top { display:flex; justify-content:space-between; align-items:flex-start; border-bottom:2px solid var(--blue); padding-bottom:10px; }
  .top small { color:var(--red); font-size:13px; line-height:1.3; }
  h1 { font-size:34px; font-weight:800; margin:0; line-height:1; }
  .lead { display:flex; gap:12px; align-items:center; margin:16px 0 8px; }
  .lead img { width:110px; height:auto; flex:none; }
  .lead p { margin:0; font-size:17px; font-weight:700; }
  label { display:block; font-size:14px; font-weight:700; color:var(--red); margin:14px 0 6px; }
  input { width:100%; font:inherit; font-size:20px; font-weight:700; color:var(--blue); background:var(--white);
          border:2px solid var(--blue); border-radius:12px; padding:12px 14px; }
  input:focus { outline:3px solid var(--pink); outline-offset:1px; }
  .hint { font-size:13px; color:var(--blue); opacity:.75; margin-top:4px; }
  button, .btn { display:block; width:100%; margin-top:14px; font:inherit; font-size:20px; font-weight:800; text-align:center;
          border-radius:999px; padding:14px; cursor:pointer; text-decoration:none; }
  #copy { background:var(--blue); color:var(--paper); border:2px solid var(--blue); }
  #copy.done { background:var(--red); border-color:var(--red); }
  .btn { background:var(--paper); color:var(--blue); border:2px solid var(--blue); }
  .steps { margin:22px 0 0; padding:14px 16px; border:2px dashed var(--blue); border-radius:12px; background:var(--white); font-size:15px; }
  .steps ol { margin:6px 0 0; padding-right:20px; }
  details { margin-top:16px; font-size:14px; }
  summary { cursor:pointer; font-weight:700; }
  pre { white-space:pre-wrap; direction:rtl; text-align:right; background:var(--white); border:1px solid var(--blue); border-radius:8px; padding:10px; font-family:inherit; font-size:14px; }
  .ltr { direction:ltr; unicode-bidi:embed; }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>מדבקות לשבת</h1>
    <small>טעמי השבת<br>מכינת חביבה רייק</small>
  </div>
  <div class="lead">
    <img src="phone.png" alt="">
    <p>כותבים את שלושת העקרונות של המניפסט שלכם, ומקבלים פרומפט מוכן ל-ChatGPT.</p>
  </div>

  <label for="p1">עיקרון ראשון</label>
  <input id="p1" maxlength="40" placeholder="למשל: הדליקו נרות עם מי שאוהבים" autocomplete="off">
  <label for="p2">עיקרון שני</label>
  <input id="p2" maxlength="40" autocomplete="off">
  <label for="p3">עיקרון שלישי</label>
  <input id="p3" maxlength="40" autocomplete="off">
  <div class="hint">כל עיקרון מתחיל בפועל, ועד חמש מילים.</div>

  <button id="copy" type="button">העתקת הפרומפט</button>
  <a class="btn" href="https://chatgpt.com/" target="_blank" rel="noopener">פתיחת ChatGPT</a>

  <div class="steps">
    <b>מה עושים</b>
    <ol>
      <li>ממלאים את שלושת העקרונות</li>
      <li>לוחצים "העתקת הפרומפט"</li>
      <li>פותחים את ChatGPT, מדביקים ושולחים</li>
    </ol>
  </div>

  <details>
    <summary>לראות את הפרומפט המלא</summary>
    <pre id="preview"></pre>
  </details>
</main>
<script>
const BASE = "סט של 3 מדבקות וואטסאפ בסגנון איור צבעוני. רקע לבן, ומסגרת לבנה עבה של מדבקה חתוכה. בכל מדבקה איור קטן ומשפט אחד בעברית, בלי מספרים ובלי כותרות. שלושת המשפטים, כל אחד במדבקה משלו:";
const ids = ["p1", "p2", "p3"], fallback = ["[המשפט הראשון]", "[המשפט השני]", "[המשפט השלישי]"];
const build = () => "@create image\n" + BASE + "\n" + ids.map((id, i) => document.getElementById(id).value.trim() || fallback[i]).join("\n");
const pv = document.getElementById("preview"), btn = document.getElementById("copy");
const refresh = () => { pv.textContent = build(); };
ids.forEach(id => document.getElementById(id).addEventListener("input", refresh)); refresh();
btn.addEventListener("click", async () => {
  const text = build();
  try { await navigator.clipboard.writeText(text); }
  catch (e) { // older phones: copy through a hidden textarea
    const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove();
  }
  btn.textContent = "הועתק! עכשיו מדביקים ב-ChatGPT"; btn.classList.add("done");
  setTimeout(() => { btn.textContent = "העתקת הפרומפט"; btn.classList.remove("done"); }, 3500);
});
</script>
</body>
</html>
